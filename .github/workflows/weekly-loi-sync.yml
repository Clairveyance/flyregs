name: Weekly LOI Sync

# Runs sync_loi.sh (FAA Legal Interpretations). Confirmed a real gap
# 2026-08-18: LOI had NO scheduled sync of any kind, ever, despite
# AC/AD/AIM/FAR/P-CG all having one since 2026-07-24 to -28 -- see
# sync_loi.sh's own header for the full story. Staggered to 15:00 UTC
# (an hour after the AD sync) so it doesn't contend with the other six
# for Supabase write throughput.
#
# Alerting: sync_loi.sh uses `set -euo pipefail`, so a failing step makes
# the whole job show as FAILED -- check via
# `gh run list --workflow=weekly-loi-sync.yml` any time.

permissions:
  contents: read

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r sync/requirements.txt

      - name: Install headless Chromium (for DRS session auto-refresh)
        run: python -m playwright install --with-deps chromium

      - name: Write .env.scraper from secrets
        run: |
          cat > .env.scraper <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          EOF

      - name: Refresh DRS session (auto -- no manual capture needed)
        run: |
          set -a; source .env.scraper; set +a
          python3 sync/refresh_drs_jwt.py --env-file .env.scraper
          # DRS's guest JWT lives ~12 hours, so a secret-based DRS_JWT
          # always eventually goes stale between Monday runs -- confirmed
          # live 2026-08-23, and RC (rightly) called manual weekly
          # re-capture "unacceptable" for an automated pipeline. This
          # mints a fresh one every run instead: refresh_drs_jwt.py drives
          # headless Chromium through the same page load a real browser
          # does (DRS sits behind Akamai bot detection, which a plain HTTP
          # client can't pass -- confirmed live that bare `requests` calls
          # to the same endpoints still 403 regardless of which one), reads
          # the jwt/user cookies DRS issues automatically on that load, and
          # writes them into .env.scraper. Fails the job loudly (non-zero
          # exit) if DRS doesn't issue them, rather than proceeding on a
          # stale/missing token.

      - name: Run LOI sync
        run: |
          chmod +x sync_loi.sh
          ./sync_loi.sh

      # A scraper that dies writes no scraper_runs row at all, so
      # scraper_freshness_check.py -- which detects absence of evidence --
      # could not tell a crash from "not Monday yet" for a whole week. That
      # is how the 2026-08-31 DRS 503 stayed invisible for five days. This
      # step runs only when the sync above failed, and leaves the trace the
      # scraper never got to write.
      - name: Record the failure so it is not invisible
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 sync/record_job_failure.py --corpus LOI \
          --workflow "$GITHUB_WORKFLOW" \
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Clean up secrets file
        if: always()
        run: rm -f .env.scraper
