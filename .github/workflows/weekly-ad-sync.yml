name: Weekly AD Sync

# Runs sync_ad.sh (Airworthiness Directives — incremental scrape, named-
# parts extraction, targeted My Aircraft alerts, MagicLink citation
# extraction). Mirrors weekly-sync.yml
# / weekly-aim-sync.yml / weekly-far-sync.yml / weekly-pcg-sync.yml for the
# same reason: shouldn't depend on any one machine being on. Staggered to
# 14:00 UTC (an hour after the PCG sync) so the five don't contend for
# Supabase write throughput at the same time.
#
# Confirmed a real gap on 2026-07-28: AD had no sync schedule of any kind
# before this workflow — ad_scraper.py's --mode incremental and
# send-ad-alerts.mjs both already existed, purpose-built for exactly this,
# but nothing had ever actually called either one on a recurring basis. See
# flyregs_gotchas.md / project_flyregs_state.md for the full writeup.
#
# Alerting: sync_ad.sh uses `set -euo pipefail`, so a failing step makes the
# whole job show as FAILED — check via
# `gh run list --workflow=weekly-ad-sync.yml` any time.
#
# Manual runs: use the "Run workflow" button in the Actions tab
# (workflow_dispatch trigger below).

permissions:
  contents: read

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      only_steps:
        description: >-
          Comma-separated step numbers to run (blank = all 8). Use "5,6,7,8"
          to exercise the full-corpus half without side effects: step 2 calls
          Claude (costs money) and step 3 sends real push notifications to
          My Aircraft owners.
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: pip install -r sync/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Write .env.scraper from secrets
        run: |
          cat > .env.scraper <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOF

      - name: Run AD sync
        env:
          # Blank on the schedule (the `inputs` context is empty for a
          # non-dispatch trigger), so the weekly run always does all 8 steps.
          ONLY_STEPS: ${{ inputs.only_steps }}
        run: |
          chmod +x sync_ad.sh
          ./sync_ad.sh

      - name: Clean up secrets file
        if: always()
        run: rm -f .env.scraper
